<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Изплащания — TT Ambassador Portal</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-mark">TT <span>PORTAL</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Табло</a>
      <a href="sales.html">Продажби</a>
      <a href="payouts.html" class="active">Изплащания</a>
      <a href="resources.html">Ресурси</a>
      <a href="profile.html">Профил</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><strong data-user-name>—</strong>Амбасадор</div>
      <a href="#" class="sidebar-logout" data-logout>Изход</a>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <button class="hamburger" data-hamburger aria-label="Меню">☰</button>
      <h1>Изплащания</h1>
      <span></span>
    </header>

    <main class="content">
      <div class="stat-card featured" style="margin-bottom:var(--space-7); max-width:420px;">
        <div class="eyebrow">Налична комисиона</div>
        <div class="value mono" id="available-balance">—</div>
        <button class="btn btn-primary" id="withdraw-btn">ИЗТЕГЛИ КОМИСИОНА</button>
      </div>

      <div class="section-head">
        <h2 style="font-size:20px;">Моите заявки за изплащане</h2>
      </div>
      <div class="table-wrap responsive-cards">
        <table>
          <thead>
            <tr><th>Заявка</th><th>Дата</th><th>Сума</th><th>Статус</th><th>Обновена</th><th></th></tr>
          </thead>
          <tbody id="payouts-body">
            <tr><td colspan="6"><div class="skeleton" style="height:20px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script type="module" src="../js/payouts.js"></script>
</body>
</html>
